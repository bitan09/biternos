version: "3.9"

# ────────────────────────────────────────────────────────────────────────────
# Bitarnos — Minecraft server hosting platform
# Full stack: Postgres + Express/TS API (with WebSocket) + React/TS frontend
# The API container mounts the host Docker socket so it can create/manage
# one isolated container per Minecraft server the user spins up.
# ────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:16-alpine
    container_name: bitarnos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bitarnos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bitarnos}
      POSTGRES_DB: ${POSTGRES_DB:-bitarnos}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bitarnos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bitarnos-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-bitarnos}:${POSTGRES_PASSWORD:-bitarnos}@postgres:5432/${POSTGRES_DB:-bitarnos}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_me_access}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_refresh}
      COOKIE_SECRET: ${COOKIE_SECRET:-change_me_cookie}
      MC_DATA_ROOT: /mc-data
      MC_DOCKER_NETWORK: bitarnos_mcnet
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - mc_data:/mc-data
    ports:
      - "4000:4000"
    networks:
      - default
      - mcnet

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:4000}
    container_name: bitarnos-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  pg_data:
  mc_data:

networks:
  # Isolated network that every spawned Minecraft server container joins.
  # Kept separate from the default compose network for extra isolation.
  mcnet:
    name: bitarnos_mcnet
    driver: bridge
